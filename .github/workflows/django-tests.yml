# Integração contínua: verifica o projeto e roda os testes automaticamente.
name: Testes Django

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  testes:
    runs-on: ubuntu-latest

    # Variáveis usadas apenas nesta verificação automática.
    # A chave abaixo é falsa e serve só para os testes (não é usada em produção).
    env:
      DJANGO_SECRET_KEY: chave-temporaria-apenas-para-testes-no-github-actions
      DJANGO_DEBUG: "False"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1

    steps:
      - name: Baixar o código do repositório
        uses: actions/checkout@v4

      - name: Instalar o Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar as dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verificar a configuração do Django
        run: python manage.py check

      - name: Verificar se faltam migrações
        run: python manage.py makemigrations --check --dry-run

      - name: Rodar os testes automatizados
        run: python manage.py test
